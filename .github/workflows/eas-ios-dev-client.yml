# Builds the iOS development client on EAS Build (Expo's cloud macOS builders).
#
# One-time setup:
#   1. Create an access token at https://expo.dev/settings/access-tokens and add it
#      as the repository secret EXPO_TOKEN (Settings → Secrets and variables → Actions).
#   2. For the "development" (real iPhone) profile only: you need an Apple Developer
#      account. Run once on any computer:
#        npx eas-cli@latest device:create          # register your iPhone
#        npx eas-cli@latest credentials -p ios     # create cert + provisioning profile
#      The "development-simulator" profile needs no Apple account.
#
# Run it from the Actions tab → "EAS iOS dev client" → Run workflow. When the build
# finishes, install it from the link in the job log or from expo.dev, then start the
# dev server with `npx expo start --dev-client`.
name: EAS iOS dev client

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - development
          - development-simulator
        default: development

concurrency:
  group: eas-ios-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (https://expo.dev/settings/access-tokens)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Links (or creates on first run) the EAS project @<your-account>/anime-app.
      - name: Link EAS project
        run: eas init --non-interactive --force

      - name: Build iOS (${{ inputs.profile }})
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive
