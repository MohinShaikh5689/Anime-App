# Publishes the JavaScript bundle to EAS Update (channel "preview"), so the dev client
# and Expo Go pick up changes without a native rebuild.
# Needs the repository secret EXPO_TOKEN (https://expo.dev/settings/access-tokens).
name: EAS Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: false
        default: ''

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (https://expo.dev/settings/access-tokens)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          eas update --channel preview --environment preview --non-interactive \
            --message "${MESSAGE:-$(git log -1 --pretty=%s)}"
